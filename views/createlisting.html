<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Listing - RU My Roommate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="navbarMount"></div>

    <div class="container mt-5">
      <div class="row">
        <div class="col-md-8 offset-md-2">
          <div class="card">
            <div class="card-header">
              <h3 class="text-center mb-0">Create Roommate Listing</h3>
            </div>
            <div class="card-body">
              <p class="text-muted mb-4">
                Fill in the details below. Address is required; other fields are
                optional.
              </p>

              <form id="createListingForm">
                <div class="mb-3">
                  <label for="address" class="form-label">Address</label>
                  <input
                    id="address"
                    class="form-control"
                    type="text"
                    placeholder="Street address (required)"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="campus" class="form-label">Campus</label>
                  <input
                    id="campus"
                    class="form-control"
                    type="text"
                    placeholder="Campus"
                  />
                </div>
                <div class="mb-3">
                  <label for="roomnumber" class="form-label">Room number</label>
                  <input
                    id="roomnumber"
                    class="form-control"
                    type="text"
                    placeholder="Room number"
                  />
                </div>
                <div class="mb-3">
                  <label for="roomtype" class="form-label">Room type</label>
                  <input
                    id="roomtype"
                    class="form-control"
                    type="text"
                    placeholder="e.g. Single, Double"
                  />
                </div>
                <div class="mb-3">
                  <label for="numrooms" class="form-label">Number of rooms</label>
                  <input
                    id="numrooms"
                    class="form-control"
                    type="number"
                    min="0"
                    placeholder="Number of rooms"
                  />
                </div>
                <div class="mb-3">
                  <label for="numroommates" class="form-label"
                    >Number of roommates</label
                  >
                  <input
                    id="numroommates"
                    class="form-control"
                    type="number"
                    min="0"
                    placeholder="Number of roommates"
                  />
                </div>
                <button type="submit" class="btn btn-primary">
                  Create Listing
                </button>
              </form>

              <p id="status" class="mt-3 mb-0 small text-muted"></p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
      (async () => {
        const user = await loadNavbar("create-listing");
        if (!user) {
          window.location.href = "/login";
          return;
        }
      })();

      document
        .getElementById("createListingForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const payload = {
            address: document.getElementById("address").value,
            campus: document.getElementById("campus").value || null,
            roomnumber: document.getElementById("roomnumber").value || null,
            roomtype: document.getElementById("roomtype").value || null,
            numrooms: document.getElementById("numrooms").value
              ? Number(document.getElementById("numrooms").value)
              : null,
            numroommates: document.getElementById("numroommates").value
              ? Number(document.getElementById("numroommates").value)
              : null,
          };

          const status = document.getElementById("status");
          status.textContent = "Submitting...";

          try {
            const res = await fetch("/api/listings", {
              method: "POST",
              credentials: "include", // IMPORTANT for session auth
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(payload),
            });

            const data = await res.json();

            if (res.ok) {
              status.textContent = "✅ Listing created!";
              console.log(data);

              document.getElementById("createListingForm").reset();
            } else {
              status.textContent =
                "❌ " + (data.error || "Failed to create listing");
            }
          } catch (err) {
            console.error(err);
            status.textContent = "❌ Server error";
          }
        });
    </script>
  </body>
</html>
