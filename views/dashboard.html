<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - RU My Roommate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="navbarMount"></div>

    <div class="container mt-5">
      <div class="row">
        <div class="col-md-8 offset-md-2">
          <div class="card">
            <div class="card-header">
              <h3 class="text-center">Welcome, <span id="username"></span>!</h3>
            </div>

            <!-- Listings Section -->
            <div class="card-body">
              <div class="card mb-4">
                <div
                  class="card-header d-flex justify-content-between align-items-center"
                >
                  <h5 class="card-title mb-0">Recent Listings</h5>
                  <a href="/create-listing" class="btn btn-sm btn-primary"
                    >Create Listing</a
                  >
                </div>
                <div class="card-body">
                  <div id="dashboardAlert" class="alert d-none" role="alert"></div>
                  <div id="listingsContainer">
                    <p class="text-muted mb-0">Loading listings...</p>
                  </div>
                </div>
              </div>

              <div class="card">
                <div class="card-header">
                  <h5 class="card-title mb-0">Saved Listings</h5>
                </div>
                <div class="card-body">
                  <div id="savedListingsContainer">
                    <p class="text-muted mb-0">Loading saved listings...</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
      let dashboardState = {
        currentUserId: null,
        savedPostIds: [],
      };

      function showDashboardAlert(message, type = "info") {
        const alertEl = document.getElementById("dashboardAlert");
        if (!alertEl) return;
        alertEl.className = `alert alert-${type}`;
        alertEl.textContent = message;
      }

      function clearDashboardAlert() {
        const alertEl = document.getElementById("dashboardAlert");
        if (!alertEl) return;
        alertEl.className = "alert d-none";
        alertEl.textContent = "";
      }

      function mapErrorMessage(response, data, fallback) {
        if (response.status === 401) return "Please log in again and retry.";
        if (response.status === 403) return "You are not allowed to modify this listing.";
        if (response.status === 404) return "This listing no longer exists.";
        if (response.status >= 500) return "Server error. Please try again in a moment.";
        return data?.error || fallback;
      }

      function setSaveButtonState(button, isSaved) {
        button.dataset.saved = isSaved ? "true" : "false";
        button.classList.toggle("btn-primary", !isSaved);
        button.classList.toggle("btn-outline-secondary", isSaved);
        button.textContent = isSaved ? "Unsave" : "Save";
      }

      function attachSaveListingHandlers() {
        document.querySelectorAll(".save-listing-btn").forEach((button) => {
          button.addEventListener("click", async () => {
            const postid = button.dataset.postid;
            const isCurrentlySaved = button.dataset.saved === "true";
            const method = isCurrentlySaved ? "DELETE" : "POST";

            button.disabled = true;

            try {
              const response = await fetch(`/api/listings/${postid}/save`, {
                method,
                credentials: "include",
              });

              const data = await response.json().catch(() => ({}));

              if (!response.ok) {
                showDashboardAlert(
                  mapErrorMessage(response, data, `Failed to ${isCurrentlySaved ? "unsave" : "save"} listing.`),
                  "danger",
                );
                button.disabled = false;
                return;
              }

              const nextSaved = !isCurrentlySaved;
              setSaveButtonState(button, nextSaved);
              button.disabled = false;

              if (nextSaved) {
                if (!dashboardState.savedPostIds.includes(postid)) {
                  dashboardState.savedPostIds = [...dashboardState.savedPostIds, postid];
                }
                showDashboardAlert("Listing saved.", "success");
              } else {
                dashboardState.savedPostIds = dashboardState.savedPostIds.filter(
                  (savedId) => String(savedId) !== String(postid),
                );
                showDashboardAlert("Listing unsaved.", "success");
              }

              refreshSavedListings();
            } catch (error) {
              console.error("Save/unsave listing request error:", error);
              showDashboardAlert("Server error while updating saved state.", "danger");
              button.disabled = false;
            }
          });
        });
      }

      function refreshListingsAfterDelete(postid) {
        const card = document.querySelector(`[data-listing-id="${postid}"]`);
        if (card) {
          card.remove();
        }

        const container = document.getElementById("listingsContainer");
        if (container && !container.querySelector("[data-listing-id]")) {
          container.innerHTML = `<p class="text-muted mb-0">No listings yet.</p>`;
        }
      }

      function attachOwnerListingHandlers() {
        document.querySelectorAll(".delete-listing-btn").forEach((button) => {
          button.addEventListener("click", async () => {
            const postid = button.dataset.postid;
            const confirmed = window.confirm("Are you sure you want to delete this listing?");
            if (!confirmed) return;

            button.disabled = true;

            try {
              const response = await fetch(`/api/listings/${postid}`, {
                method: "DELETE",
                credentials: "include",
              });
              const data = await response.json().catch(() => ({}));

              if (!response.ok) {
                button.disabled = false;
                showDashboardAlert(
                  mapErrorMessage(response, data, "Failed to delete listing."),
                  "danger",
                );
                return;
              }

              refreshListingsAfterDelete(postid);
              showDashboardAlert("Listing deleted successfully.", "success");
            } catch (error) {
              console.error("Delete listing request error:", error);
              button.disabled = false;
              showDashboardAlert("Server error while deleting listing.", "danger");
            }
          });
        });

        document.querySelectorAll(".edit-listing-btn").forEach((button) => {
          button.addEventListener("click", async () => {
            const postid = button.dataset.postid;
            const currentAddress = button.dataset.address || "";
            const currentCampus = button.dataset.campus || "";
            const currentRoomtype = button.dataset.roomtype || "";
            const nextAddress = window.prompt("Update address", currentAddress);

            if (nextAddress === null) return;
            if (!nextAddress.trim()) {
              showDashboardAlert("Address is required to update listing.", "danger");
              return;
            }

            const nextCampus = window.prompt("Update campus (optional)", currentCampus);
            if (nextCampus === null) return;
            const nextRoomtype = window.prompt("Update room type (optional)", currentRoomtype);
            if (nextRoomtype === null) return;

            button.disabled = true;

            try {
              const response = await fetch(`/api/listings/${postid}`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify({
                  address: nextAddress.trim(),
                  campus: nextCampus.trim() || null,
                  roomtype: nextRoomtype.trim() || null,
                }),
              });

              const data = await response.json().catch(() => ({}));

              if (!response.ok) {
                showDashboardAlert(
                  mapErrorMessage(response, data, "Failed to update listing."),
                  "danger",
                );
                button.disabled = false;
                return;
              }

              const listings = await fetch("/api/listings", {
                credentials: "include",
              }).then((r) => r.json());
              renderListings(listings, dashboardState.currentUserId, dashboardState.savedPostIds);
              showDashboardAlert("Listing updated successfully.", "success");
            } catch (error) {
              console.error("Edit listing request error:", error);
              showDashboardAlert("Server error while updating listing.", "danger");
              button.disabled = false;
            }
          });
        });
      }

      function renderListings(listings, currentUserId, savedPostIds = []) {
        const container = document.getElementById("listingsContainer");
        const savedPostIdSet = new Set(savedPostIds.map((id) => String(id)));

        if (!Array.isArray(listings) || listings.length === 0) {
          container.innerHTML = `
        <p class="text-muted mb-0">No listings yet.</p>
      `;
          return;
        }

        container.innerHTML = listings
          .map((listing) => {
            const isMine = String(listing.userid) === String(currentUserId);
            const isSaved = savedPostIdSet.has(String(listing.postid));

            return `
          <div class="card mb-3 shadow-sm" data-listing-id="${listing.postid}">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <div>
                  <h6 class="card-title mb-1">
                    ${listing.address || "No address provided"}
                  </h6>
                  <p class="text-muted mb-0">
                    Posted by ${listing.realname || listing.netid || "Unknown user"}
                    ${isMine ? '<span class="badge bg-secondary ms-2">Your Listing</span>' : ""}
                  </p>
                </div>
                <small class="text-muted">
                  ${listing.createtime ? new Date(listing.createtime).toLocaleDateString() : ""}
                </small>
              </div>

              <div class="row">
                <div class="col-md-6 mb-2">
                  <strong>Campus:</strong> ${listing.campus || "Not specified"}
                </div>
                <div class="col-md-6 mb-2">
                  <strong>Room Type:</strong> ${listing.roomtype || "Not specified"}
                </div>
                <div class="col-md-6 mb-2">
                  <strong>Room Number:</strong> ${listing.roomnumber || "Not specified"}
                </div>
                <div class="col-md-6 mb-2">
                  <strong>Rooms / Roommates:</strong>
                  ${listing.numrooms ?? "?"} / ${listing.numroommates ?? "?"}
                </div>
                <div class="col-md-6 mb-2">
                  ${
                    isMine
                      ? `
                      <strong>Manage Listing:</strong>
                      <div class="d-flex gap-2 mt-1 flex-wrap">
                        <button class="btn btn-sm btn-outline-primary edit-listing-btn"
                          data-postid="${listing.postid}"
                          data-address="${listing.address || ""}"
                          data-campus="${listing.campus || ""}"
                          data-roomtype="${listing.roomtype || ""}">
                          Edit
                        </button>
                        <button class="btn btn-sm btn-outline-danger delete-listing-btn" data-postid="${listing.postid}">
                          Delete
                        </button>
                      </div>
                    `
                      : `
                      <strong>${isSaved ? "Saved Listing:" : "Save Listing:"}</strong>
                      <button
                        class="btn btn-sm ${isSaved ? "btn-outline-secondary" : "btn-primary"} save-listing-btn"
                        data-postid="${listing.postid}"
                        data-saved="${isSaved ? "true" : "false"}"
                      >
                        ${isSaved ? "Unsave" : "Save"}
                      </button>
                    `
                  }
                </div>
              </div>
            </div>
          </div>
        `;
          })
          .join("");
        attachSaveListingHandlers();
        attachOwnerListingHandlers();
      }

      function formatText(value, fallback = "Not specified") {
        if (value === null || value === undefined) return fallback;
        const text = String(value).trim();
        return text.length > 0 ? text : fallback;
      }

      function formatCount(value) {
        if (value === null || value === undefined || value === "") return "?";
        const num = Number(value);
        return Number.isFinite(num) ? num : "?";
      }

      function renderSavedListings(listings) {
        const container = document.getElementById("savedListingsContainer");
        const safeListings = Array.isArray(listings) ? listings : [];

        if (safeListings.length === 0) {
          container.innerHTML = `<p class="text-muted mb-0">You have no saved listings yet.</p>`;
          return;
        }

        container.innerHTML = safeListings
          .map((listing) => `
            <div class="card mb-3 shadow-sm" data-saved-listing-id="${listing.postid}">
              <div class="card-body">
                <div class="d-flex justify-content-between align-items-start mb-2">
                  <div>
                    <h6 class="card-title mb-1">${formatText(listing.address, "No address provided")}</h6>
                    <p class="text-muted mb-0">
                      Posted by ${formatText(listing.realname || listing.netid, "Unknown user")}
                    </p>
                  </div>
                  <small class="text-muted">
                    ${listing.createtime ? new Date(listing.createtime).toLocaleDateString() : ""}
                  </small>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-2"><strong>Campus:</strong> ${formatText(listing.campus)}</div>
                  <div class="col-md-6 mb-2"><strong>Room Type:</strong> ${formatText(listing.roomtype)}</div>
                  <div class="col-md-6 mb-2"><strong>Room Number:</strong> ${formatText(listing.roomnumber)}</div>
                  <div class="col-md-6 mb-2">
                    <strong>Rooms / Roommates:</strong> ${formatCount(listing.numrooms)} / ${formatCount(listing.numroommates)}
                  </div>
                </div>
              </div>
            </div>
          `)
          .join("");
      }

      async function refreshSavedListings() {
        const container = document.getElementById("savedListingsContainer");
        try {
          const response = await fetch("/api/saved-listings", {
            credentials: "include",
          });
          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            const message = mapErrorMessage(response, data, "Failed to load saved listings.");
            container.innerHTML = `<p class="text-danger mb-0">${message}</p>`;
            return;
          }

          renderSavedListings(data.listings);
        } catch (error) {
          console.error("Failed to load saved listings:", error);
          container.innerHTML = `<p class="text-danger mb-0">Failed to load saved listings.</p>`;
        }
      }
    </script>
    <script>
      // -----------------------------------------------------------
      // Main page load logic
      // WHY:
      // We wait for navbar to load AND determine auth state
      // before rendering dashboard data.
      // -----------------------------------------------------------
      (async () => {
        // 1) Load navbar and get user session info
        const user = await loadNavbar("dashboard");

        // 2) If no user → redirect to login
        // WHY:
        // Prevent unauthorized access to dashboard page.
        if (!user) {
          window.location.href = "/login";
          return;
        }

        // 3) Populate user info on dashboard
        // WHY:
        // We already have user data from loadNavbar.
        // No need to fetch again.
        document.getElementById("username").textContent =
          user.realname || user.netid;

        // 5) Load listings feed
        try {
          clearDashboardAlert();
          const savedIdsResponse = await fetch("/api/saved-listing-ids", {
            credentials: "include",
          });
          const savedIdsData = await savedIdsResponse.json();

          if (!savedIdsResponse.ok) {
            throw new Error(savedIdsData.error || "Failed to load saved listing ids");
          }

          const listings = await fetch("/api/listings", {
            credentials: "include",
          }).then((r) => r.json());

          const safeSavedIds = Array.isArray(savedIdsData.savedPostIds)
            ? savedIdsData.savedPostIds
            : [];

          dashboardState = {
            currentUserId: user.userid,
            savedPostIds: safeSavedIds,
          };

          renderListings(listings, user.userid, safeSavedIds);
          await refreshSavedListings();
        } catch (error) {
          console.error("Failed to load listings:", error);
          document.getElementById("listingsContainer").innerHTML = `
            <p class="text-danger mb-0">Failed to load listings.</p>
          `;
          document.getElementById("savedListingsContainer").innerHTML = `
            <p class="text-danger mb-0">Failed to load saved listings.</p>
          `;
        }
      })();
    </script>
  </body>
</html>
