<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - RU My Roommate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="navbarMount"></div>

    <div class="container mt-5">
      <div class="row">
        <div class="col-md-8 offset-md-2">
          <div class="card">
            <div class="card-header">
              <h3 class="text-center">Welcome, <span id="username"></span>!</h3>
            </div>
            <div class="card-body">
              <div class="mb-4">
                <h4>Account Details</h4>
                <p><strong>NetID:</strong> <span id="netId"></span></p>
                <p><strong>Account Status:</strong> Active</p>
              </div>

              <div class="card mb-4">
                <div class="card-header">
                  <h5 class="card-title mb-0">Your Preferences</h5>
                </div>
                <div class="card-body">
                  <form id="preferencesForm">
                    <div class="mb-3">
                      <label for="preferences" class="form-label"
                        >Your Preferences</label
                      >
                      <textarea
                        class="form-control"
                        id="preferences"
                        rows="3"
                        placeholder="Enter your preferences (e.g., Dark theme, Email notifications, English language)"
                      ></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">
                      Update Preferences
                    </button>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
      // -----------------------------------------------------------
      // Main page load logic
      // WHY:
      // We wait for navbar to load AND determine auth state
      // before rendering dashboard data.
      // -----------------------------------------------------------
      (async () => {
        // 1) Load navbar and get user session info
        const user = await loadNavbar("dashboard");

        // 2) If no user → redirect to login
        // WHY:
        // Prevent unauthorized access to dashboard page.
        if (!user) {
          window.location.href = "/login";
          return;
        }

        // 3) Populate user info on dashboard
        // WHY:
        // We already have user data from loadNavbar.
        // No need to fetch again.
        document.getElementById("username").textContent =
          user.realname || user.netid;

        document.getElementById("netId").textContent = user.netid;

        // 4) Populate preferences textarea
        // WHY:
        // Preferences may be null in DB.
        // We default to {} to prevent JSON errors.
        const preferences = user.preferences || {};

        document.getElementById("preferences").value = JSON.stringify(
          preferences,
          null,
          2,
        );
      })();

      // -----------------------------------------------------------
      // Preferences form submission
      // -----------------------------------------------------------
      document
        .getElementById("preferencesForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          // 1) Parse JSON safely
          let prefs;
          try {
            prefs = JSON.parse(
              document.getElementById("preferences").value || "{}",
            );
          } catch (err) {
            alert("Invalid JSON. Fix formatting before saving.");
            return;
          }

          // 2) Never allow client to override userid
          // WHY:
          // Security principle: never trust client.
          delete prefs.userid;

          try {
            const response = await fetch("/api/update-preferences", {
              method: "POST",
              credentials: "include",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(prefs),
            });

            const data = await response.json();

            if (response.ok) {
              alert("Preferences updated successfully!");

              // Refresh user data visually
              // WHY:
              // Ensures dashboard reflects updated DB values.
              const refreshedUser = await fetch("/api/user-data", {
                credentials: "include",
              }).then((r) => r.json());

              document.getElementById("preferences").value = JSON.stringify(
                refreshedUser.preferences || {},
                null,
                2,
              );
            } else {
              alert(data.error || "Error updating preferences");
            }
          } catch (error) {
            alert("Error updating preferences");
          }
        });
    </script>
  </body>
</html>
